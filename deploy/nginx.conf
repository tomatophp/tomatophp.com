# /etc/nginx/sites-available/demo.tomatophp.com
# TLS terminates at Cloudflare and Nginx Proxy Manager; this vhost serves plain HTTP on the private bridge.
server {
    listen 80;
    server_name demo.tomatophp.com;

    # Atomic releases: deploy/deploy.sh switches this symlink.
    root /srv/tomatophp-demo/current/public;
    index index.php;

    client_max_body_size 32m;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
